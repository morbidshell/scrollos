name: build-image

on:
  push:
    branches: [main]
    paths-ignore: ["README.md"]
  schedule:
    - cron: "0 1,14 * * *"   # daily rebuild picks up package + OpenSnitch/Windscribe updates
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # The image (Steam, kernel, codecs) plus dnf caches needs a lot of room.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # OpenSnitch and Windscribe RPMs. Fetched here with the GitHub CLI, which uses the
      # authenticated API (the job's own token), because github.com's web endpoints kept
      # answering 504 when the container build downloaded them itself.
      - name: Fetch OpenSnitch and Windscribe RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fetch-rpms.sh rpms

      - name: Build
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "IMAGE=${IMAGE}" >> "$GITHUB_ENV"
          # Registry/mirror downloads occasionally drop mid-transfer. Retry; layers
          # that already finished are cached, so a retry resumes where it failed.
          for attempt in 1 2 3; do
            sudo podman build --pull=newer \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              -t "${IMAGE}:latest" -f Containerfile . && break
            [ "${attempt}" -lt 3 ] || exit 1
            echo "::warning::build attempt ${attempt} failed, retrying in 30s"
            sleep 30
          done

      - name: Push
        run: |
          # GHCR_TOKEN (optional): a classic PAT with write:packages. It acts as you, so it
          # can push to a package that exists but isn't linked to this repo. Without it
          # the job's GITHUB_TOKEN is used.
          echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          sudo podman tag "${IMAGE}:latest" "${IMAGE}:$(date +%Y%m%d)"
          sudo podman push "${IMAGE}:latest"
          sudo podman push "${IMAGE}:$(date +%Y%m%d)"
