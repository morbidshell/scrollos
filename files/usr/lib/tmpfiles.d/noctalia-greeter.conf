# /var is not part of the image, so create the greeter's state directory at boot
# and relabel it (xdm_var_lib_t, see etc/selinux/.../file_contexts.local) so the
# SELinux-confined greeter (xdm_t) can write its synced wallpaper/palette there.
d /var/lib/noctalia-greeter 0755 greetd greetd -
Z /var/lib/noctalia-greeter - - - -
