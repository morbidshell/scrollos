# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
---
name: scrollos
description: btd987/bazzite-niri (Bazzite + Niri + Noctalia) plus Ghostty, Waterfox, Bottles, Lutris, Steam, and Windscribe.

# Base image: btd987's published Bazzite + Niri + native Noctalia v5 image,
# instead of building Niri/Noctalia ourselves. Their image already handles
# the Niri/Noctalia COPR, session setup, and keeps Bazzite's own kernel/Mesa
# stack intact. We only layer our extra packages on top of it.
# https://github.com/btd987/bluefin-niri
#
# Use the -nvidia variant instead if you're on Nvidia hardware:
#   base-image: ghcr.io/btd987/bazzite-niri-nvidia
base-image: ghcr.io/btd987/bazzite-niri
image-version: stable

modules:
  - type: dnf
    cleanup: true
    repos:
      # Waterfox (BrowserWorks) via openSUSE Build Service.
      # %OS_VERSION% is substituted with the Fedora version at build time.
      files:
        - https://download.opensuse.org/repositories/isv:/BrowserWorks/Fedora_%OS_VERSION%/isv:BrowserWorks.repo

      # COPRs — Niri/Noctalia's COPR (lionheartp/Hyprland) is no longer
      # needed here since the base image already provides them.
      copr:
        - wehagy/protonplus
        - vertigo-red/bottles
        - scottames/ghostty

      nonfree: rpmfusion


    install:
      skip-unavailable: true
      packages:
        - ghostty
        - waterfox
        - bottles
        - lutris
        - steam

  # Windscribe isn't packaged in a repo/COPR, and the download URL always
  # points at whatever the current release's rpm is (filename changes every
  # version), so it's fetched and installed with a script instead of the
  # dnf module's URL-install feature. See files/scripts/install-windscribe.sh
  - type: script
    scripts:
      - install-windscribe.sh

  # No systemd module needed here: btd987's image already wires up Niri as
  # a session on top of Bazzite's existing display manager (SDDM/GDM), so
  # there's nothing to enable/disable for the desktop itself.

  - type: signing
